{% extends 'base.html' %}{% block content %}<section class="global-section"><div class="container account-shell account-security"><div class="account-card">{% if validlink %}<h1>Choose a new password</h1><form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary" type="submit">Save new password</button></form>{% else %}<h1>This link is no longer valid</h1><p>The link may have expired or already been used.</p><a class="btn btn-primary" href="{% url 'password_reset' %}">Request a new link</a>{% endif %}</div></div></section>{% endblock %}
