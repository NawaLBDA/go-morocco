<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Basma | Page not found</title>
  <style>
    :root{color-scheme:dark;}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial; background:linear-gradient(120deg,#0b1220,#0f2a2e); color:#fff;}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:48px;}
    .card{max-width:760px;width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:28px;backdrop-filter:blur(10px);}
    h1{margin:0 0 10px;font-size:1.8rem;letter-spacing:.01em;}
    p{margin:0 0 16px;line-height:1.6;color:rgba(255,255,255,.88)}
    a{display:inline-block;padding:10px 14px;border-radius:12px;text-decoration:none;color:#fff;border:1px solid rgba(255,255,255,.22)}
    a.primary{background:#2a9d8f;border-color:#2a9d8f}
    a:hover{filter:brightness(1.05)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Page not found.</h1>
      <p>The link may be broken, or the page may have been moved.</p>
      <a class="primary" href="/">Back to Home</a>
    </div>
  </div>
</body>
</html>
